volumes:
  postgres-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_PASSWORD=password

  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces:cached
command: n8n start
environment:
  - N8N_BASIC_AUTH_USER=your_username   # Thay 'your_username' bằng tên đăng nhập bạn muốn
  - N8N_BASIC_AUTH_PASSWORD=your_password  # Thay 'your_password' bằng mật khẩu bạn muốn

